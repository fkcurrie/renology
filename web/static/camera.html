<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Renology Cottage Live Camera</title>
  <link rel="stylesheet" href="style.css?v=2.6.0">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📹</text></svg>">
  <style>
    body.camera-popout-body {
      margin: 0;
      padding: 0;
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .popout-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-bottom: 1px solid rgba(59, 130, 246, 0.2);
    }
    .popout-video-container {
      flex: 1;
      position: relative;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .popout-video-container video {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .popout-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 16px;
      background: rgba(15, 23, 42, 0.95);
      border-top: 1px solid rgba(59, 130, 246, 0.2);
    }
  </style>
</head>
<body class="camera-popout-body">
  <header class="popout-header">
    <div class="camera-modal-title">
      <span class="camera-live-badge" id="cameraStatusBadge">● CONNECTING</span>
      <span class="camera-title-text">RENOLOGY COTTAGE CAM</span>
      <span class="camera-meta-pill" id="cameraResPill">720p HD • 30fps</span>
    </div>
    <div class="camera-header-actions">
      <button id="cameraFullscreenBtn" class="camera-icon-btn" title="Toggle Fullscreen">⛶ Fullscreen</button>
    </div>
  </header>

  <main class="popout-video-container">
    <video id="cameraVideo" autoplay muted playsinline></video>
    <div class="camera-loading-overlay" id="cameraLoadingOverlay">
      <div class="camera-spinner"></div>
      <div class="camera-loading-text" id="cameraLoadingText">Connecting to Cottage live stream...</div>
    </div>
  </main>

  <footer class="popout-footer">
    <div class="camera-audio-controls">
      <button id="cameraAudioToggle" class="camera-audio-btn muted" title="Click to Unmute Cottage Audio">
        <span id="cameraAudioIcon">🔇</span> <span id="cameraAudioLabel">Audio Muted (Click to Unmute)</span>
      </button>
      <input type="range" id="cameraVolumeSlider" min="0" max="1" step="0.05" value="1.0" class="camera-volume-slider" title="Microphone Volume">
    </div>
    <div class="camera-stats-hud">
      <span id="cameraLatencyBadge" class="hud-pill">LATENCY: ~1.0s</span>
      <span id="cameraViewersBadge" class="hud-pill">VIEWERS: 1</span>
      <span class="hud-pill hw-accel">VA-API HW ACCEL</span>
    </div>
  </footer>

  <script src="camera.js?v=2.6.0"></script>
  <script>
    function launch() {
      if (window.RenologyCamera) {
        window.RenologyCamera.initPopoutView();
      }
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', launch);
    } else {
      launch();
    }
  </script>
</body>
</html>
